{#- Homepage-only "Contact us" button in the sticky header (navbar_persistent,
    so it shows at every width). pydata-sphinx-theme drops header templates
    that render empty, so every other page keeps its original header. #}
{%- if pagename == "index" %}
<a class="pm-navbar-contact" href="https://www.pymc-labs.com/contact" aria-label="{{ _('Contact us') }}">
  <i class="fa-solid fa-envelope" aria-hidden="true"></i>
  <span class="pm-navbar-contact__label">{{ _("Contact us") }}</span>
</a>
{%- endif %}
