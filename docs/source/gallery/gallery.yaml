# Source of truth for notebook cards (#1617, #3119). Workflow: docs/source/gallery/README.md.
# notebook is a docname relative to docs/source with no suffix, for example notebooks/mmm/mmm_quickstart.
# part is optional: intro, guide, or case. Omit it to leave the notebook untagged.
# An untagged notebook stays on the holding page at its current URL. An empty part page is expected until cards are tagged.

