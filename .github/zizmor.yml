# zizmor baseline configuration.
#
# Keep this minimal: scope each ignore to the exact finding (file:line)
# and delete the entry when the underlying workflow is fixed. Inline
# `# zizmor: ignore[rule]` comments live in the workflows themselves.
#
# Remaining entry: generate-test-durations.yml interpolates a
# pull-request-number output from peter-evans/create-pull-request into
# a run: script. Informational only: the output is a number produced by
# a locked, trusted action, not attacker-controlled input.
rules:
  template-injection:
    ignore:
      - generate-test-durations.yml:85
