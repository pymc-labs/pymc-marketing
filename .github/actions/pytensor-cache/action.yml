name: PyTensor compile cache
description: >-
  Restore and save PyTensor compile caches (C compiledir and numba file
  cache) under a version-derived key. The job must set the portable-target
  pins (PYTENSOR_FLAGS=cxxflags=-march=x86-64 and NUMBA_CPU_NAME=generic)
  so cache keys do not embed the runner's CPU: numba keys include the host
  CPU name and pytensor's C keys include auto-detected march flags, and
  GitHub's runner fleet is heterogeneous.

inputs:
  publish:
    description: >-
      Whether this job publishes a snapshot. Only the durations job (which
      runs the full suite) should publish: its snapshot is a superset of
      every test slice, and under actions/cache's newest-wins restore rule
      the most complete newest entry is what maximizes hit rate. Test jobs
      restore-only.
    type: boolean
    default: false

  lineage:
    description: >-
      Label for the publishing job's save key, e.g. "durations". Unused by
      restore-only consumers.
    default: durations

runs:
  using: composite
  steps:
    - name: Compute PyTensor cache key
      shell: bash
      run: |
        uv run --no-sync python "$GITHUB_ACTION_PATH/compute_key.py"

    - name: Restore PyTensor compile caches (restore-only)
      id: restore
      if: ${{ inputs.publish != true }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.pytensor
        key: pytensor-${{ hashFiles('.pytensor-cache-key') }}-restore-${{ github.run_id }}
        restore-keys: |
          pytensor-${{ hashFiles('.pytensor-cache-key') }}-

    - name: Bootstrap save on total cache miss
      # Restore-only consumers normally never publish. On a total miss
      # (fresh scope, version-key change) they seed the pool once, so CI
      # does not stay cold until the publishing job succeeds. Partial
      # restores (prefix hit) stay silent: the publisher's full-suite
      # snapshot is the proper cover for the delta.
      if: ${{ inputs.publish != true && steps.restore.outputs.cache-matched-key == '' }}
      uses: actions/cache/save@v6
      with:
        path: ~/.pytensor
        key: pytensor-${{ hashFiles('.pytensor-cache-key') }}-bootstrap-${{ github.run_id }}-${{ runner.name }}

    - name: Restore and save PyTensor compile caches
      if: ${{ inputs.publish == true }}
      uses: actions/cache@v6
      with:
        path: ~/.pytensor
        key: pytensor-${{ hashFiles('.pytensor-cache-key') }}-${{ inputs.lineage }}-${{ github.run_id }}
        restore-keys: |
          pytensor-${{ hashFiles('.pytensor-cache-key') }}-

    - name: Inspect PyTensor cache
      shell: bash
      run: |
        echo "PYTENSOR_FLAGS=$PYTENSOR_FLAGS"
        echo "NUMBA_CPU_NAME=$NUMBA_CPU_NAME"
        echo "pytensor .so count after restore: $(find ~/.pytensor -name '*.so' 2>/dev/null | wc -l)"
        echo "numba .nbc count after restore: $(find ~/.pytensor -name '*.nbc' 2>/dev/null | wc -l)"
        du -sh ~/.pytensor 2>/dev/null || true
        ls ~/.pytensor 2>/dev/null || true
        mkdir -p /tmp/pytensor-cache-stats
        (find ~/.pytensor -name '*.so' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/restore_so
        (find ~/.pytensor -name '*.nbc' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/restore_nbc
