name: PyTensor compile cache
description: >-
  Compute the PyTensor compile-cache version key and restore compiled
  artifacts (C compiledir and numba file cache) for the current
  environment. The job must set the portable-target pins
  (PYTENSOR_FLAGS=cxxflags=-march=x86-64,compiledir_format=... and
  NUMBA_CPU_NAME=generic) so cache keys do not embed the runner's CPU:
  numba keys include the host CPU name and pytensor's C compiledir name
  embeds platform details, and GitHub's runner fleet is heterogeneous.

runs:
  using: composite
  steps:
    - name: Compute PyTensor cache key
      shell: bash
      run: |
        uv run --no-sync python "$GITHUB_ACTION_PATH/compute_key.py"

    - name: Record canonical snapshot key
      # The full-suite durations job publishes ONE snapshot under this
      # static key (delete-then-save, since actions/cache never
      # overwrites). Every other job restores it read-only.
      shell: bash
      run: echo "pytensor-${{ hashFiles('.pytensor-cache-key') }}-snapshot" > /tmp/pytensor-snapshot-key

    - name: Restore PyTensor compile caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.pytensor
        key: pytensor-${{ hashFiles('.pytensor-cache-key') }}-restore-${{ github.run_id }}
        restore-keys: |
          pytensor-${{ hashFiles('.pytensor-cache-key') }}-

    - name: Inspect PyTensor cache
      shell: bash
      run: |
        echo "PYTENSOR_FLAGS=$PYTENSOR_FLAGS"
        echo "NUMBA_CPU_NAME=$NUMBA_CPU_NAME"
        echo "pytensor .so count after restore: $(find ~/.pytensor -name '*.so' 2>/dev/null | wc -l)"
        echo "numba .nbc count after restore: $(find ~/.pytensor -name '*.nbc' 2>/dev/null | wc -l)"
        du -sh ~/.pytensor 2>/dev/null || true
        ls ~/.pytensor 2>/dev/null || true
        mkdir -p /tmp/pytensor-cache-stats
        (find ~/.pytensor -name '*.so' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/restore_so
        (find ~/.pytensor -name '*.nbc' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/restore_nbc
