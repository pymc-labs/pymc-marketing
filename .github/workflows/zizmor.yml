# Security audit of GitHub Actions workflows with zizmor.
# https://docs.zizmor.sh/
#
# Runs online audits, which the pre-commit hook does not: this adds
# known-vulnerable-actions, impostor-commit and ref-confusion.

name: zizmor

# No paths filter: this is a required status check on main, and a
# skipped workflow leaves the required check pending.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.9.2
        with:
          inputs: .github/workflows
          online-audits: true
          advanced-security: false
          annotations: true
