name: Read the Docs Pull Request Preview
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  documentation-links:
    runs-on: ubuntu-latest
    steps:
      - uses: readthedocs/actions/preview@v1.5
        with:
          project-slug: "pymc-marketing"
