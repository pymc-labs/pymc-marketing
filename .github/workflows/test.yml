name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_test: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            code:
              - ".github/workflows/test.yml"
              - "pyproject.toml"
              - "tests/**.py"
              - "pymc_marketing/**"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.should_test == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Pin both compile caches to a portable target so cache keys do not
      # embed the runner's CPU. GitHub's fleet is heterogeneous: with
      # native CPU targeting, numba's cache key includes the host CPU name
      # and pytensor's C key includes auto-detected march flags, so warm
      # restores only hit on runners of the same CPU generation.
      PYTENSOR_FLAGS: cxxflags=-march=x86-64
      NUMBA_CPU_NAME: generic
    strategy:
      fail-fast: false
      matrix:
        config: [ {python-version: "3.14", oldest-pymc: false}, {python-version: "3.14", oldest-pymc: true}]
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install ${{ matrix.config.python-version }}
      - name: Set up environment
        run: uv venv --python ${{ matrix.config.python-version }}
      - name: Install package and dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      - name: Pin oldest versions of PyMC and extras
        if: ${{ matrix.config.oldest-pymc }}
        run: |
          OLDEST=$(grep '"pymc>=' pyproject.toml | head -1 | sed 's/.*>=//' | sed 's/[",].*//')
          PYMC_EXTRAS=$(grep '"pymc-extras' pyproject.toml | head -1 | sed 's/.*"\(pymc-extras[^"]*\)".*/\1/')
          uv pip install "${PYMC_EXTRAS}" "pymc==${OLDEST}"
      - name: Check oldest version of PyMC
        if: ${{ matrix.config.oldest-pymc }}
        run: |
          OLDEST=$(grep '"pymc>=' pyproject.toml | head -1 | sed 's/.*>=//' | sed 's/[",].*//')
          uv run --no-sync --frozen python -c "import pymc; assert pymc.__version__ == '${OLDEST}', pymc.__version__"
      - name: Compute PyTensor cache key
        run: |
          # Python version is intentionally not recorded: the numba cache
          # suffixes cache files with the interpreter version and the C
          # compiledir embeds it in its directory name, so entries
          # self-select at load time.
          uv run --no-sync python -c "
          import importlib.metadata as md

          # pymc is deliberately not keyed: its version does not participate
          # in compilation cache keys, and keying it would split pools when
          # the oldest-pymc matrix pin is real.
          pkgs = ['pytensor', 'numba', 'llvmlite', 'numpy', 'scipy']

          def ver(pkg):
              try:
                  return md.version(pkg)
              except Exception:
                  return 'missing'

          with open('.pytensor-cache-key', 'w') as f:
              for pkg in pkgs:
                  f.write(f'{pkg}={ver(pkg)}\n')
          "
          test -f .pytensor-cache-key || echo 'fallback=unknown' > .pytensor-cache-key
      - name: Restore PyTensor compile caches
        uses: actions/cache@v4
        with:
          path: ~/.pytensor
          key: pytensor-${{ hashFiles('.pytensor-cache-key') }}-${{ github.run_id }}-group${{ matrix.group }}
          restore-keys: |
            pytensor-${{ hashFiles('.pytensor-cache-key') }}-
      - name: Inspect restored PyTensor cache
        run: |
          echo "PYTENSOR_FLAGS=$PYTENSOR_FLAGS"
          echo "NUMBA_CPU_NAME=$NUMBA_CPU_NAME"
          echo "pytensor .so count after restore: $(find ~/.pytensor -name '*.so' 2>/dev/null | wc -l)"
          echo "numba .nbc count after restore: $(find ~/.pytensor -name '*.nbc' 2>/dev/null | wc -l)"
          du -sh ~/.pytensor 2>/dev/null || true
      - name: Run tests
        run: |
          echo "pytensor .so count before tests: $(find ~/.pytensor -name '*.so' 2>/dev/null | wc -l)"
          uv run --no-sync --frozen pytest --splits 6 \
                 --group ${{ matrix.group }} \
                 --splitting-algorithm least_duration \
                 --durations-path .test_durations
          echo "pytensor .so count after tests: $(find ~/.pytensor -name '*.so' 2>/dev/null | wc -l)"
          echo "numba .nbc count after tests: $(find ~/.pytensor -name '*.nbc' 2>/dev/null | wc -l)"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
          flags: py${{ matrix.config.python-version }}${{ matrix.config.oldest-pymc && '-oldest' || '-latest' }}
          fail_ci_if_error: false

  test_slow:
    needs: changes
    if: ${{ needs.changes.outputs.should_test == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]  # Reduced from 3 to 2 groups for better balance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install 3.13
      - name: Set up environment
        run: uv venv --python 3.13
      - name: Install package and dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      - name: Run tests
        run: |
          uv run pytest --only-slow \
                 --splits 2 \
                 --group ${{ matrix.group }} \
                 --splitting-algorithm least_duration \
                 --durations-path .test_durations
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
          name: "test_slow"
          fail_ci_if_error: false

  all_tests:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [changes, test, test_slow]
    steps:
      - name: Check build matrix status
        if: ${{ !contains(fromJSON('["success", "skipped"]'), needs.test.result) || !contains(fromJSON('["success", "skipped"]'), needs.test_slow.result) }}
        run: exit 1
