name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_test: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            code:
              - ".github/workflows/test.yml"
              - ".github/actions/pytensor-cache/**"
              - "pyproject.toml"
              - "tests/**.py"
              - "pymc_marketing/**"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.should_test == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Pin both compile caches to a portable target so cache keys do not
      # embed the runner's CPU. GitHub's fleet is heterogeneous: with
      # native CPU targeting, numba's cache key includes the host CPU name
      # and pytensor's C key includes auto-detected march flags, so warm
      # restores only hit on runners of the same CPU generation.
      PYTENSOR_FLAGS: >-
        cxxflags=-march=x86-64,compiledir_format=compiledir-%(python_version)s-%(python_bitwidth)s
      NUMBA_CPU_NAME: generic
    strategy:
      fail-fast: false
      matrix:
        config: [ {python-version: "3.14", oldest-pymc: false}, {python-version: "3.14", oldest-pymc: true}]
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Python
        run: uv python install ${{ matrix.config.python-version }}
      - name: Set up environment
        run: uv venv --python ${{ matrix.config.python-version }}
      - name: Install package and dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      - name: Pin oldest versions of PyMC and extras
        if: ${{ matrix.config.oldest-pymc }}
        run: |
          OLDEST=$(grep '"pymc>=' pyproject.toml | head -1 | sed 's/.*>=//' | sed 's/[",].*//')
          PYMC_EXTRAS=$(grep '"pymc-extras' pyproject.toml | head -1 | sed 's/.*"\(pymc-extras[^"]*\)".*/\1/')
          uv pip install "${PYMC_EXTRAS}" "pymc==${OLDEST}"
      - name: Check oldest version of PyMC
        if: ${{ matrix.config.oldest-pymc }}
        run: |
          OLDEST=$(grep '"pymc>=' pyproject.toml | head -1 | sed 's/.*>=//' | sed 's/[",].*//')
          uv run --no-sync --frozen python -c "import pymc; assert pymc.__version__ == '${OLDEST}', pymc.__version__"
      - name: PyTensor compile cache
        uses: $/.github/actions/pytensor-cache
        with:
          lineage: ${{ matrix.config.oldest-pymc && 'oldest' || 'latest' }}-group${{ matrix.group }}
      - name: Run tests
        run: |
          uv run --no-sync --frozen pytest --splits 6 \
                 --group ${{ matrix.group }} \
                 --splitting-algorithm least_duration \
                 --durations-path .test_durations
      - name: Collect PyTensor cache counts
        if: always()
        run: |
          mkdir -p /tmp/pytensor-cache-stats
          (find ~/.pytensor -name '*.so' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/after_so
          (find ~/.pytensor -name '*.nbc' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/after_nbc
      - name: Report PyTensor cache hit rate
        if: always()
        run: |
          rso=$(cat /tmp/pytensor-cache-stats/restore_so)
          rnbc=$(cat /tmp/pytensor-cache-stats/restore_nbc)
          aso=$(cat /tmp/pytensor-cache-stats/after_so)
          anbc=$(cat /tmp/pytensor-cache-stats/after_nbc)
          c_so=$((aso - rso)); c_nbc=$((anbc - rnbc))
          pct_so=$(awk -v c="$c_so" -v t="$aso" 'BEGIN { printf "%.0f", (t > 0) ? 100 - 100 * c / t : 100 }')
          pct_nbc=$(awk -v c="$c_nbc" -v t="$anbc" 'BEGIN { printf "%.0f", (t > 0) ? 100 - 100 * c / t : 100 }')
          {
            echo "### PyTensor cache hit rate: ${{ matrix.config.python-version }}, group ${{ matrix.group }}"
            echo ""
            echo "| cache | restored | compiled fresh | total after | hit rate |"
            echo "|---|---:|---:|---:|---:|"
            echo "| C modules (.so) | $rso | $c_so | $aso | ${pct_so}% |"
            echo "| numba fragments (.nbc) | $rnbc | $c_nbc | $anbc | ${pct_nbc}% |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload durations chunk
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: durations-chunk-${{ matrix.config.oldest-pymc && 'oldest' || 'latest' }}-group${{ matrix.group }}
          path: test_durations_chunks/*.json
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
          flags: py${{ matrix.config.python-version }}${{ matrix.config.oldest-pymc && '-oldest' || '-latest' }}
          fail_ci_if_error: false

  test_slow:
    needs: changes
    if: ${{ needs.changes.outputs.should_test == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]  # Reduced from 3 to 2 groups for better balance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Set up environment
        run: uv venv --python 3.13
      - name: Install package and dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      - name: Run tests
        run: |
          uv run pytest --only-slow \
                 --splits 2 \
                 --group ${{ matrix.group }} \
                 --splitting-algorithm least_duration \
                 --durations-path .test_durations
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
          name: "test_slow"
          fail_ci_if_error: false
      - name: Upload durations chunk
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: durations-chunk-slow-group${{ matrix.group }}
          path: test_durations_chunks/slow-group*.json
          if-no-files-found: ignore

  durations-combine:
    needs: [test, test_slow]
    # Refresh the durations file from the shards on every main push; PRs
    # run the shards but must not update the shared bookkeeping.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.test_slow.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: durations-chunk-*
          merge-multiple: true
          path: chunks
      - name: Merge duration chunks
        run: |
          python3 - <<'PY'
          import glob
          import json

          merged = {}
          files = sorted(glob.glob("chunks/*.json"))
          for f in files:
              merged.update(json.load(open(f)))
          with open(".test_durations", "w") as fh:
              json.dump(merged, fh, indent=1)
          print(f"merged {len(merged)} tests from {len(files)} chunks")
          PY
      - name: Ensure newline at end of durations file
        run: |
          # Add newline if missing (pre-commit requirement)
          [ -n "$(tail -c1 .test_durations)" ] && echo >> .test_durations || true
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          # PAT so that pushing the PR branch triggers CI workflows
          # (GITHUB_TOKEN-created commits leave checks in `action_required`
          # forever, so the PR can never merge). Fallback keeps the workflow
          # functional until the secret is added.
          token: ${{ secrets.TEST_DURATIONS_PAT || github.token }}
          commit-message: "chore: update test durations"
          branch: update-test-durations
          delete-branch: true
          title: "chore: update test durations"
          add-paths: |
            .test_durations
          body: |
            ## Automated Test Durations Update

            This PR updates the `.test_durations` file with the latest test execution times from the test matrix shards.

            **Details:**
            - 🤖 Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 📅 Trigger: ${{ github.event_name }}

            **Note:** This is an automated update. The file will be used by pytest-split to balance test groups in CI.
          labels: |
            no releasenotes
            maintenance
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.TEST_DURATIONS_PAT || github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"

  all_tests:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [changes, test, test_slow]
    steps:
      - name: Check build matrix status
        if: ${{ !contains(fromJSON('["success", "skipped"]'), needs.test.result) || !contains(fromJSON('["success", "skipped"]'), needs.test_slow.result) }}
        run: exit 1
