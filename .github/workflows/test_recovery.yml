name: Parameter-recovery tests

# Statistical recovery / simulation studies (NUTS fits inside each test).
# Too slow and too seed-sensitive to gate pull requests, so these run on a
# schedule with a `--only-recovery` selection instead of per-PR.
on:
  schedule:
    # nightly at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A scheduled run may be long; don't cancel it behind a manual dispatch.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Standard public-repo runners are free and already 4-core; parallelism
  # (shards) is the wall-clock lever for this job, not larger runners,
  # which are billed per-minute even for public repositories.
  test_recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install 3.13
      - name: Set up environment
        run: uv venv --python 3.13
      - name: Install package and dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e ".[test]"
      - name: Run recovery tests
        # cvm linker: the default `auto` routes to numba with PyTensor 3,
        # which is measurably slower for these sampling-heavy tests; and
        # linker parity is PyMC/PyTensor's concern, not ours.
        env:
          PYTENSOR_FLAGS: linker=cvm
        run: |
          uv run --no-sync --frozen pytest --only-recovery \
                 --splits 4 \
                 --group ${{ matrix.group }} \
                 --splitting-algorithm least_duration \
                 --durations-path .test_durations

  # Nightly path only: a failed dispatch is visible in the Actions UI and
  # must not file a tracking issue implying `main` is broken.
  notify:
    needs: [test_recovery]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Create or update the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Parameter-recovery tests failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          comment=$(printf "Recovery run failed: %s (ref %s, trigger %s - scroll to the failed shard for the pytest tail)." \
            "$RUN_URL" "${{ github.ref_name }}" "${{ github.event_name }}")
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "$TITLE in:title state:open" --json number --jq '.[0].number')
          if [ -z "$issue_number" ]; then
            printf 'Created %s\n' "$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body "$comment")"
          else
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$comment"
            printf 'Updated %s\n' "$issue_number"
          fi
