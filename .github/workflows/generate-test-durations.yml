name: Generate Test Durations

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Sunday at midnight UTC
    - cron: '0 0 * * 3'  # Wednesday at midnight UTC
    # Twice weekly: the repo's cache retention is 7 days (org limit), so a
    # single failed run must not strand the compile-cache pool until the
    # next week.
  push:
    branches: [main]
    # An environment change moves the version key, and only this job
    # publishes under it - so republish promptly on dependency bumps
    # instead of leaving every test run cold until the next cron.
    paths:
      - "uv.lock"
      - "pyproject.toml"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-durations:
    runs-on: ubuntu-latest
    env:
      # Match the test job's portable-target pins so this job shares the
      # same cache pool (keys must not embed the runner's CPU).
      PYTENSOR_FLAGS: >-
        cxxflags=-march=x86-64,compiledir_format=compiledir-%(python_version)s-%(python_bitwidth)s
      NUMBA_CPU_NAME: generic
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install 3.14
      - name: Set up environment
        run: uv venv --python 3.14
      - name: Install dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      - name: PyTensor compile cache
        uses: $/.github/actions/pytensor-cache
      - name: Run all tests with duration tracking
        # --run-slow: record real timings for slow-marked tests instead of
        # their skip times (test_slow groups balance on this file)
        # --clean-durations: replace the whole file each run instead of
        # merging, so deleted tests cannot persist as phantom entries
        run: |
          uv run --no-sync pytest --store-durations --durations-path .test_durations --clean-durations --run-slow -v
        continue-on-error: true  # Generate durations even if some tests fail
      - name: Guard against truncated durations file
        # continue-on-error is intentional above, but a hard pytest crash
        # (segfault/OOM) would skip sessionfinish and leave a partial file;
        # refuse to open the PR if that happened
        run: |
          collected=$(uv run --no-sync pytest --collect-only -q 2>/dev/null | grep -o "[0-9]* tests collected" | cut -d' ' -f1)
          stored=$(uv run --no-sync python -c "import json; print(len(json.load(open('.test_durations'))))")
          echo "collected=${collected} stored=${stored}"
          if [ -z "${collected}" ] || [ "${stored}" -lt "${collected}" ]; then
            echo "::error::Durations file is truncated (${stored} stored < ${collected} collected); not opening PR"
            exit 1
          fi
      - name: Ensure newline at end of durations file
        run: |
          # Add newline if missing (pre-commit requirement)
          [ -n "$(tail -c1 .test_durations)" ] && echo >> .test_durations || true
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          # PAT so that pushing the PR branch triggers CI workflows
          # (GITHUB_TOKEN-created commits leave checks in `action_required`
          # forever, so the PR can never merge). Fallback keeps the workflow
          # functional until the secret is added.
          token: ${{ secrets.TEST_DURATIONS_PAT || github.token }}
          commit-message: "chore: update test durations"
          branch: update-test-durations
          delete-branch: true
          title: "chore: update test durations"
          add-paths: |
            .test_durations
          body: |
            ## Automated Test Durations Update

            This PR updates the `.test_durations` file with the latest test execution times from the full test suite.

            **Details:**
            - 🤖 Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 📅 Trigger: ${{ github.event_name }}

            **Note:** This is an automated update. The file will be used by pytest-split to balance test groups in CI.
          labels: |
            no releasenotes
            maintenance
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.TEST_DURATIONS_PAT || github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
