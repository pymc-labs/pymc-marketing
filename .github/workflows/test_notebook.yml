name: Test Notebooks

on:
  pull_request:
    branches: [main]
    paths:
     - "pyproject.toml"
     - "tests/**.py"
     - "pymc_marketing/**"
     - ".github/workflows/test_notebook.yml"
     - "scripts/run_notebooks/**.py"
     - "docs/source/notebooks/**.ipynb"
     - "!docs/source/notebooks/*/dev/**.ipynb"
     - "docs/source/guide/**.ipynb"
  push:
    branches: [main]
    paths:
     - "pyproject.toml"
     - "tests/**.py"
     - "pymc_marketing/**"
     - ".github/workflows/test_notebook.yml"
     - "scripts/run_notebooks/**.py"
     - "docs/source/notebooks/**.ipynb"
     - "!docs/source/notebooks/*/dev/**.ipynb"
     - "docs/source/guide/**.ipynb"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        split:
          # MMM runs in three splits to stay under the 60 min timeout (#3179)
          - "--notebooks mmm --end-idx 10"
          - "--notebooks mmm --start-idx 10 --end-idx 30"
          - "--notebooks mmm --start-idx 30"
          - "--notebooks clv"
          - "--notebooks bass"
          - "--notebooks customer_choice"
          - "--notebooks general"
          - "--exclude-dirs mmm clv bass customer_choice general"
    steps:
    - uses: actions/checkout@v7

    # Some MMM notebooks load a fitted posterior stored in Git LFS
    # (docs/source/notebooks/mmm/multidimensional_model.nc, 95 MB). Pull it
    # only in the MMM splits, and cache it so runs do not spend LFS bandwidth.
    - name: List LFS objects
      if: startsWith(matrix.split, '--notebooks mmm')
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

    - name: Restore LFS cache
      if: startsWith(matrix.split, '--notebooks mmm')
      uses: actions/cache@v6
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}

    - name: Pull LFS objects
      if: startsWith(matrix.split, '--notebooks mmm')
      run: git lfs pull

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2

    - name: Install dependencies
      run: |
        sudo apt-get install graphviz graphviz-dev
        uv venv --python 3.12
        uv pip install --upgrade pip
        uv pip install -e ".[docs,test,dag]"
        uv pip list

    - name: Run notebooks
      run: uv run scripts/run_notebooks/runner.py ${{ matrix.split }}
